<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finance Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* -----------------------------------------------------------------------
     Design tokens
     Тёмный терминал-минимализм: стекло (glass) + один неоновый акцент.
     Shape lock: карточки 16px, интерактивные пилюли — full pill, инпуты 10px.
     Типографика: sans для UI/навигации, mono для чисел/дат.
  ----------------------------------------------------------------------- */
  :root {
    --bg: #050607;
    --glass-bg: rgba(255,255,255,0.045);
    --glass-border: rgba(255,255,255,0.08);
    --glass-highlight: rgba(255,255,255,0.06);
    --text-primary: #F5F5F7;
    --text-secondary: rgba(245,245,247,0.55);
    --text-tertiary: rgba(245,245,247,0.35);
    --accent: #39FF88;
    --accent-glow: rgba(57,255,136,0.35);
    --accent-ink: #06110A; /* текст поверх сплошного accent-фона, для контраста */
    --expense: #FF5C5C;
    --income: #39FF88;
    --radius-card: 16px;
    --radius-input: 10px;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(ellipse at top, #0A0C0D 0%, var(--bg) 60%);
    color: var(--text-primary);
    font-family: var(--font-ui);
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: 16px 16px calc(88px + env(safe-area-inset-bottom)) 16px;
    position: relative;
  }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn .18s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  h1, h2, h3, p { margin: 0; }

  .glass-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-card);
    box-shadow: inset 0 1px 0 var(--glass-highlight);
    padding: 18px;
  }

  @media (prefers-reduced-transparency: reduce) {
    .glass-card { background: #16181A; backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-tertiary);
    margin-bottom: 10px;
    display: block;
  }

  .balance-card {
    text-align: center;
    padding: 28px 18px 22px 18px;
    margin-bottom: 16px;
  }
  .balance-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .balance-value {
    font-family: var(--font-mono);
    font-size: 40px;
    font-weight: 600;
    color: var(--accent);
    text-shadow: 0 0 24px var(--accent-glow);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .balance-sub {
    margin-top: 10px;
    display: flex;
    justify-content: center;
    gap: 18px;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .balance-sub span.income { color: var(--income); }
  .balance-sub span.expense { color: var(--expense); }
  .balance-sub .lbl { color: var(--text-tertiary); font-family: var(--font-ui); margin-right: 4px; }

  .segmented {
    display: flex;
    background: rgba(255,255,255,0.05);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .segmented::-webkit-scrollbar { display: none; }
  .segmented button {
    flex: 1 0 auto;
    white-space: nowrap;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .segmented button.active {
    background: rgba(255,255,255,0.12);
    color: var(--text-primary);
  }

  .row-list { display: flex; flex-direction: column; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .row:last-child { border-bottom: none; }
  .row-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .row-icon {
    width: 34px; height: 34px; border-radius: 999px;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .row-text { min-width: 0; }
  .row-title { font-size: 15px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 12px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-amount { font-family: var(--font-mono); font-size: 15px; font-variant-numeric: tabular-nums; flex-shrink: 0; padding-left: 10px; }
  .row-amount.income { color: var(--income); }
  .row-amount.expense { color: var(--expense); }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-tertiary);
    font-size: 14px;
  }

  .date-group-label {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-tertiary);
    margin: 18px 0 8px 2px;
  }
  .date-group-label:first-child { margin-top: 0; }

  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)) 16px;
    background: rgba(5,6,7,0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
  }
  .tabbar-inner {
    width: 100%;
    max-width: 448px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 8px;
  }
  .tab-btn {
    background: none; border: none; color: var(--text-tertiary);
    font-family: var(--font-ui); font-size: 11px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 10px; cursor: pointer;
  }
  .tab-btn .tab-icon { font-size: 20px; line-height: 1; }
  .tab-btn.active { color: var(--accent); }
  .tab-add {
    width: 52px; height: 52px; border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 400;
    border: none; cursor: pointer;
    box-shadow: 0 0 20px var(--accent-glow);
    margin: -18px 4px 0 4px;
    flex-shrink: 0;
  }
  .tab-add:active { transform: scale(0.96); }

  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .sheet-overlay.open { display: flex; }
  .sheet {
    width: 100%; max-width: 480px;
    background: #101214;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    border: 1px solid var(--glass-border);
    border-bottom: none;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom)) 18px;
    max-height: 88dvh;
    overflow-y: auto;
  }
  .sheet-handle {
    width: 36px; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,0.2);
    margin: 0 auto 16px auto;
  }
  .sheet-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
  .field-label { font-size: 13px; color: var(--text-secondary); margin: 16px 0 8px 0; display: block; }
  .field-label:first-of-type { margin-top: 0; }

  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.04);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

  .amount-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-input);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 28px;
    padding: 14px 14px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .amount-input:focus { outline: none; border-color: var(--accent); }

  .text-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-input);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 15px;
    padding: 12px 14px;
  }
  .text-input:focus { outline: none; border-color: var(--accent); }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 999px;
    font-family: var(--font-ui);
    font-size: 16px;
    font-weight: 600;
    padding: 15px;
    margin-top: 20px;
    cursor: pointer;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }

  .btn-secondary {
    width: 100%;
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    font-family: var(--font-ui);
    font-size: 15px;
    padding: 13px;
    margin-top: 8px;
    cursor: pointer;
  }

  .error-text { color: var(--expense); font-size: 13px; margin-top: 10px; display: none; }
  .error-text.visible { display: block; }

  .skeleton-row {
    height: 44px;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.07), rgba(255,255,255,0.03));
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    margin-bottom: 8px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .top-bar h1 { font-size: 20px; font-weight: 600; }
  .link-btn {
    background: none; border: none; color: var(--text-secondary);
    font-family: var(--font-ui); font-size: 13px; cursor: pointer; padding: 6px 0;
  }

  .mb-12 { margin-bottom: 12px; }
  .mb-16 { margin-bottom: 16px; }
</style>
<style>
  /* Состояния оптимистичного UI */
  .row.pending { opacity: 0.55; }
  .row.failed { opacity: 1; }
  .row.failed .row-title::after {
    content: ' · не сохранено';
    color: var(--expense);
    font-size: 12px;
  }
  .stale-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-tertiary);
    padding: 6px 0 0 0;
    font-family: var(--font-mono);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(100px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(12px);
    background: #1C1C1E;
    border: 1px solid var(--glass-border);
    color: var(--text-primary);
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 100;
    max-width: 88%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--expense); }
</style>

</head>
<body>

<div id="app">

  <section id="screen-dashboard" class="screen active">
    <div class="top-bar"><h1>Финансы</h1></div>

    <div class="glass-card balance-card">
      <div class="balance-label">Баланс за период</div>
      <div class="balance-value" id="dashboard-balance">···</div>
      <div class="balance-sub">
        <span><span class="lbl">Доход</span><span class="income" id="dashboard-income">···</span></span>
        <span><span class="lbl">Расход</span><span class="expense" id="dashboard-expense">···</span></span>
      </div>
      <div class="stale-hint" id="stale-hint" style="display:none;">обновляем…</div>
    </div>

    <div class="segmented mb-16" id="period-selector">
      <button data-period="today">Сегодня</button>
      <button data-period="week" class="active">Неделя</button>
      <button data-period="month">Месяц</button>
      <button data-period="quarter">Квартал</button>
      <button data-period="half_year">Полгода</button>
      <button data-period="year">Год</button>
    </div>

    <span class="section-label">Расходы по категориям</span>
    <div class="glass-card mb-16">
      <div class="row-list" id="dashboard-expense-breakdown">
        <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
      </div>
    </div>

    <span class="section-label">Доходы по категориям</span>
    <div class="glass-card">
      <div class="row-list" id="dashboard-income-breakdown">
        <div class="skeleton-row"></div>
      </div>
    </div>
  </section>

  <section id="screen-history" class="screen">
    <div class="top-bar"><h1>История</h1></div>
    <div class="glass-card" id="history-container">
      <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
    </div>
  </section>

</div>

<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tab-btn active" data-screen="dashboard">
      <span class="tab-icon">&#9633;</span><span>Дашборд</span>
    </button>
    <button class="tab-add" id="btn-open-add">+</button>
    <button class="tab-btn" data-screen="history">
      <span class="tab-icon">&#8801;</span><span>История</span>
    </button>
  </div>
</div>

<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Новая операция</div>

    <div class="segmented mb-12" id="type-selector">
      <button data-type="expense" class="active">Расход</button>
      <button data-type="income">Доход</button>
    </div>

    <label class="field-label">Сумма</label>
    <input type="number" inputmode="decimal" class="amount-input" id="input-amount" placeholder="0" step="0.01">

    <label class="field-label">Категория</label>
    <div class="chip-grid" id="category-chips"></div>

    <label class="field-label">Дата</label>
    <div class="segmented" id="date-selector">
      <button data-date-mode="today" class="active">Сегодня</button>
      <button data-date-mode="yesterday">Вчера</button>
      <button data-date-mode="custom">Выбрать</button>
    </div>
    <input type="date" class="text-input mb-12" id="input-custom-date" style="display:none; margin-top:8px;">

    <label class="field-label">Комментарий (необязательно)</label>
    <input type="text" class="text-input" id="input-comment" placeholder="Например: обед с коллегами" maxlength="500">

    <div class="error-text" id="sheet-error"></div>

    <button class="btn-primary" id="btn-save-transaction">Сохранить</button>
    <button class="btn-secondary" id="btn-cancel-sheet">Отмена</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===========================================================================
   Finance Tracker — Mini App

   Хостится отдельно от backend (не через Apps Script doGet): GAS оборачивает
   HTML во вложенный iframe на чужом домене, а Telegram не отдаёт initData
   такому фрейму — initData всегда приходит пустым. Здесь страница работает
   на верхнем уровне, поэтому авторизация проходит нормально.

   Модель работы с данными:
   1. При старте мгновенно рисуем последнее известное состояние из
      localStorage (если есть) — приложение выглядит загруженным сразу.
   2. Параллельно один bootstrap-запрос приносит актуальные категории и
      все активные транзакции.
   3. Дашборд и переключение периодов считаются локально из этих транзакций,
      без обращений к серверу. Сырьё приходит с сервера, агрегация —
      детерминированная, повторяет серверную логику один в один.
   4. Запись оптимистична: изменение видно сразу, запрос уходит в фон,
      при ошибке — откат и уведомление.
=========================================================================== */

var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyZ0YFZeiZXJ4JOfH714-Etdjdqq7MwOm3pzgI5Z-hGs2GWZscEr4bLS4Qnj8YtPpcC/exec?api=miniapp';
var CACHE_KEY = 'ft_cache_v1';

var TG_INIT_DATA = null;

var state = {
  currentPeriod: 'week',
  currentType: 'expense',
  selectedCategoryId: null,
  selectedDateMode: 'today',
  categories: { expense: [], income: [] },
  transactions: [],
  categoryNames: {},
  serverToday: null,
  loaded: false
};

/* ------------------------------------------------------------------ */
/* Транспорт                                                           */
/* ------------------------------------------------------------------ */

function callServer(action) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(GAS_API_URL, {
    method: 'POST',
    // text/plain — "simple request", не вызывает CORS preflight,
    // который Apps Script не обрабатывает.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, args: [TG_INIT_DATA].concat(args) })
  })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (json) {
      if (!json.success) throw new Error(json.error || 'Ошибка сервера');
      return json.result;
    });
}

/* ------------------------------------------------------------------ */
/* Локальный кэш между запусками                                       */
/* ------------------------------------------------------------------ */

function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      categories: state.categories,
      transactions: state.transactions.filter(function (t) { return !t.__pending && !t.__failed; }),
      serverToday: state.serverToday,
      savedAt: Date.now()
    }));
  } catch (e) { /* приватный режим или переполнение — не критично */ }
}

function loadCache() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

/* ------------------------------------------------------------------ */
/* Периоды — та же логика, что на сервере (неделя с понедельника)      */
/* ------------------------------------------------------------------ */

function todayParts() {
  var s = (state.serverToday || new Date().toISOString().slice(0, 10)).split('-');
  return { year: +s[0], month: +s[1], day: +s[2] };
}

function fmtCal(p) {
  return p.year + '-' + String(p.month).padStart(2, '0') + '-' + String(p.day).padStart(2, '0');
}

function addDaysCal(p, days) {
  var d = new Date(Date.UTC(p.year, p.month - 1, p.day) + days * 86400000);
  return { year: d.getUTCFullYear(), month: d.getUTCMonth() + 1, day: d.getUTCDate() };
}

function isoWeekday(p) {
  var d = new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay();
  return d === 0 ? 7 : d;
}

function lastDayOfMonth(year, month) {
  return new Date(Date.UTC(year, month, 0)).getUTCDate();
}

function resolvePeriod(key) {
  var t = todayParts();
  switch (key) {
    case 'today':
      return { startDate: fmtCal(t), endDate: fmtCal(t) };
    case 'week': {
      var mon = addDaysCal(t, -(isoWeekday(t) - 1));
      return { startDate: fmtCal(mon), endDate: fmtCal(addDaysCal(mon, 6)) };
    }
    case 'month':
      return {
        startDate: fmtCal({ year: t.year, month: t.month, day: 1 }),
        endDate: fmtCal({ year: t.year, month: t.month, day: lastDayOfMonth(t.year, t.month) })
      };
    case 'quarter': {
      var qs = Math.floor((t.month - 1) / 3) * 3 + 1, qe = qs + 2;
      return {
        startDate: fmtCal({ year: t.year, month: qs, day: 1 }),
        endDate: fmtCal({ year: t.year, month: qe, day: lastDayOfMonth(t.year, qe) })
      };
    }
    case 'half_year': {
      var hs = t.month <= 6 ? 1 : 7, he = hs + 5;
      return {
        startDate: fmtCal({ year: t.year, month: hs, day: 1 }),
        endDate: fmtCal({ year: t.year, month: he, day: lastDayOfMonth(t.year, he) })
      };
    }
    case 'year':
      return {
        startDate: fmtCal({ year: t.year, month: 1, day: 1 }),
        endDate: fmtCal({ year: t.year, month: 12, day: 31 })
      };
    default:
      return resolvePeriod('week');
  }
}

/* ------------------------------------------------------------------ */
/* Локальный расчёт дашборда                                           */
/* ------------------------------------------------------------------ */

function computeDashboard(periodKey) {
  var p = resolvePeriod(periodKey);
  var income = 0, expenses = 0;
  var byExpense = {}, byIncome = {};

  state.transactions.forEach(function (t) {
    if (t.__failed) return;
    var date = t.operation_date;
    if (date < p.startDate || date > p.endDate) return;

    var amount = Number(t.amount) || 0;
    if (t.type === 'income') {
      income += amount;
      byIncome[t.category_id] = (byIncome[t.category_id] || 0) + amount;
    } else {
      expenses += amount;
      byExpense[t.category_id] = (byExpense[t.category_id] || 0) + amount;
    }
  });

  return {
    totals: {
      income: round2(income),
      expenses: round2(expenses),
      balance: round2(income - expenses)
    },
    expenseByCategory: breakdown(byExpense),
    incomeByCategory: breakdown(byIncome)
  };
}

function breakdown(map) {
  return Object.keys(map).map(function (id) {
    return { categoryId: id, categoryName: state.categoryNames[id] || id, amount: round2(map[id]) };
  }).sort(function (a, b) { return b.amount - a.amount; });
}

function round2(v) { return Math.round(v * 100) / 100; }

/* ------------------------------------------------------------------ */
/* Отрисовка                                                           */
/* ------------------------------------------------------------------ */

function formatMoney(v) {
  return (Number(v) || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' \u20BD';
}

function formatDateLabel(dateStr) {
  var t = state.serverToday || new Date().toISOString().slice(0, 10);
  if (dateStr === t) return 'Сегодня';
  var parts = t.split('-');
  var y = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]) - 86400000)
    .toISOString().slice(0, 10);
  if (dateStr === y) return 'Вчера';
  var d = dateStr.split('-');
  return d[2] + '.' + d[1] + '.' + d[0];
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function renderDashboard() {
  var d = computeDashboard(state.currentPeriod);
  document.getElementById('dashboard-balance').textContent = formatMoney(d.totals.balance);
  document.getElementById('dashboard-income').textContent = formatMoney(d.totals.income);
  document.getElementById('dashboard-expense').textContent = formatMoney(d.totals.expenses);
  renderBreakdown('dashboard-expense-breakdown', d.expenseByCategory);
  renderBreakdown('dashboard-income-breakdown', d.incomeByCategory);
}

function renderBreakdown(containerId, items) {
  var el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = '<div class="empty-state">Нет данных за этот период</div>';
    return;
  }
  el.innerHTML = items.map(function (item) {
    return '<div class="row"><div class="row-left">' +
      '<div class="row-icon">' + escapeHtml((item.categoryName || '?').charAt(0)) + '</div>' +
      '<div class="row-text"><div class="row-title">' + escapeHtml(item.categoryName) + '</div></div>' +
      '</div><div class="row-amount">' + formatMoney(item.amount) + '</div></div>';
  }).join('');
}

function renderHistory() {
  var el = document.getElementById('history-container');
  var list = state.transactions;

  if (!list.length) {
    el.innerHTML = '<div class="empty-state">Пока нет операций.<br>Нажмите + , чтобы добавить первую.</div>';
    return;
  }

  var groups = {}, order = [];
  list.forEach(function (t) {
    if (!groups[t.operation_date]) { groups[t.operation_date] = []; order.push(t.operation_date); }
    groups[t.operation_date].push(t);
  });
  order.sort().reverse();

  var html = '';
  order.forEach(function (date) {
    html += '<div class="date-group-label">' + formatDateLabel(date) + '</div><div class="row-list">';
    groups[date].forEach(function (t) {
      var isIncome = t.type === 'income';
      var cls = t.__pending ? ' pending' : (t.__failed ? ' failed' : '');
      html += '<div class="row' + cls + '" data-tx-id="' + escapeHtml(t.id) + '">' +
        '<div class="row-left">' +
          '<div class="row-icon">' + (isIncome ? '&#8593;' : '&#8595;') + '</div>' +
          '<div class="row-text">' +
            '<div class="row-title">' + escapeHtml(state.categoryNames[t.category_id] || t.category_id) + '</div>' +
            (t.comment ? '<div class="row-sub">' + escapeHtml(t.comment) + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="row-amount ' + (isIncome ? 'income' : 'expense') + '">' +
          (isIncome ? '+' : '\u2212') + formatMoney(t.amount) +
        '</div></div>';
    });
    html += '</div>';
  });

  el.innerHTML = html;

  el.querySelectorAll('.row[data-tx-id]').forEach(function (row) {
    row.addEventListener('click', function () {
      cancelTransactionOptimistic(row.getAttribute('data-tx-id'));
    });
  });
}

function renderAll() {
  renderDashboard();
  renderHistory();
}

function rebuildCategoryNames() {
  state.categoryNames = {};
  state.categories.expense.concat(state.categories.income).forEach(function (c) {
    state.categoryNames[c.id] = c.name;
  });
}

function showToast(message, isError) {
  var el = document.getElementById('toast');
  el.textContent = message;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(el.__timer);
  el.__timer = setTimeout(function () { el.className = 'toast'; }, 3000);
}

function setStale(isStale) {
  document.getElementById('stale-hint').style.display = isStale ? 'block' : 'none';
}

/* ------------------------------------------------------------------ */
/* Навигация                                                           */
/* ------------------------------------------------------------------ */

document.querySelectorAll('.tab-btn[data-screen]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var target = btn.getAttribute('data-screen');
    document.querySelectorAll('.tab-btn[data-screen]').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById('screen-' + target).classList.add('active');
  });
});

document.querySelectorAll('#period-selector button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('#period-selector button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.currentPeriod = btn.getAttribute('data-period');
    renderDashboard(); // локально, мгновенно, без запроса
  });
});

/* ------------------------------------------------------------------ */
/* Форма добавления                                                    */
/* ------------------------------------------------------------------ */

var sheetOverlay = document.getElementById('sheet-overlay');

document.getElementById('btn-open-add').addEventListener('click', openAddSheet);
document.getElementById('btn-cancel-sheet').addEventListener('click', closeSheet);
sheetOverlay.addEventListener('click', function (e) {
  if (e.target === sheetOverlay) closeSheet();
});

function openAddSheet() {
  state.selectedCategoryId = null;
  state.selectedDateMode = 'today';
  state.currentType = 'expense';

  document.getElementById('input-amount').value = '';
  document.getElementById('input-comment').value = '';
  document.getElementById('sheet-error').classList.remove('visible');
  document.getElementById('input-custom-date').style.display = 'none';

  setSegmentActive('#date-selector', 'data-date-mode', 'today');
  setSegmentActive('#type-selector', 'data-type', 'expense');

  renderCategoryChips();
  sheetOverlay.classList.add('open');
}

function closeSheet() { sheetOverlay.classList.remove('open'); }

function setSegmentActive(selector, attr, value) {
  document.querySelectorAll(selector + ' button').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute(attr) === value);
  });
}

document.querySelectorAll('#type-selector button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    setSegmentActive('#type-selector', 'data-type', btn.getAttribute('data-type'));
    state.currentType = btn.getAttribute('data-type');
    state.selectedCategoryId = null;
    renderCategoryChips();
  });
});

document.querySelectorAll('#date-selector button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var mode = btn.getAttribute('data-date-mode');
    setSegmentActive('#date-selector', 'data-date-mode', mode);
    state.selectedDateMode = mode;
    document.getElementById('input-custom-date').style.display = mode === 'custom' ? 'block' : 'none';
  });
});

/** Категории уже в памяти после bootstrap — запрос не нужен. */
function renderCategoryChips() {
  var container = document.getElementById('category-chips');
  var list = state.categories[state.currentType] || [];

  if (!list.length) {
    container.innerHTML = state.loaded
      ? '<div class="empty-state">Нет доступных категорий</div>'
      : '<div class="skeleton-row" style="width:100%"></div>';
    return;
  }

  container.innerHTML = list.map(function (c) {
    return '<button type="button" class="chip" data-category-id="' + escapeHtml(c.id) + '">' +
      escapeHtml(c.name) + '</button>';
  }).join('');

  container.querySelectorAll('.chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      container.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('selected'); });
      chip.classList.add('selected');
      state.selectedCategoryId = chip.getAttribute('data-category-id');
    });
  });
}

/* ------------------------------------------------------------------ */
/* Оптимистичное сохранение                                            */
/* ------------------------------------------------------------------ */

document.getElementById('btn-save-transaction').addEventListener('click', function () {
  var errorEl = document.getElementById('sheet-error');
  errorEl.classList.remove('visible');

  var amount = document.getElementById('input-amount').value;
  var comment = document.getElementById('input-comment').value;

  if (!amount || Number(amount) <= 0) return showFieldError('Укажите сумму больше нуля');
  if (!state.selectedCategoryId) return showFieldError('Выберите категорию');

  var date;
  if (state.selectedDateMode === 'today') date = state.serverToday || 'today';
  else if (state.selectedDateMode === 'yesterday') date = 'yesterday';
  else {
    date = document.getElementById('input-custom-date').value;
    if (!date) return showFieldError('Выберите дату');
  }

  saveTransactionOptimistic({
    type: state.currentType,
    categoryId: state.selectedCategoryId,
    amount: Number(amount),
    date: date,
    comment: comment
  });

  closeSheet();
});

function showFieldError(message) {
  var el = document.getElementById('sheet-error');
  el.textContent = message;
  el.classList.add('visible');
}

/**
 * Рисуем транзакцию сразу, запрос уходит в фон.
 *
 * clientId — идемпотентный ключ: если запрос уйдёт дважды (ретрай, слабая
 * сеть), сервер вернёт уже созданную запись вместо дубля. Пока ответа нет,
 * строка отображается приглушённой — пользователь видит, что она ещё в пути,
 * а не считает её подтверждённой.
 */
function saveTransactionOptimistic(input) {
  var clientId = Date.now() + '_' + Math.random().toString(36).slice(2, 8);

  var optimistic = {
    id: 't_' + clientId,
    type: input.type,
    category_id: input.categoryId,
    amount: input.amount,
    operation_date: resolveLocalDate(input.date),
    comment: input.comment,
    status: 'active',
    __pending: true
  };

  state.transactions.unshift(optimistic);
  renderAll();

  callServer('apiCreateTransaction', input.type, input.categoryId, input.amount,
             input.date, input.comment, clientId)
    .then(function (saved) {
      var idx = findTxIndex(optimistic.id);
      if (idx !== -1) state.transactions[idx] = saved;
      renderAll();
      saveCache();
    })
    .catch(function (err) {
      var idx = findTxIndex(optimistic.id);
      if (idx !== -1) {
        state.transactions[idx].__pending = false;
        state.transactions[idx].__failed = true;
      }
      renderAll();
      showToast('Не удалось сохранить операцию', true);
      console.error(err);
    });
}

function resolveLocalDate(date) {
  if (date === 'today') return state.serverToday || new Date().toISOString().slice(0, 10);
  if (date === 'yesterday') {
    var base = state.serverToday || new Date().toISOString().slice(0, 10);
    var p = base.split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]) - 86400000).toISOString().slice(0, 10);
  }
  return date;
}

function findTxIndex(id) {
  for (var i = 0; i < state.transactions.length; i++) {
    if (state.transactions[i].id === id) return i;
  }
  return -1;
}

/** Отмена тоже оптимистична: строка исчезает сразу, при ошибке возвращается. */
function cancelTransactionOptimistic(transactionId) {
  var idx = findTxIndex(transactionId);
  if (idx === -1) return;

  var removed = state.transactions[idx];
  if (removed.__pending) {
    showToast('Операция ещё сохраняется');
    return;
  }
  if (!confirm('Отменить эту операцию?')) return;

  state.transactions.splice(idx, 1);
  renderAll();
  saveCache();

  callServer('apiCancelTransaction', transactionId)
    .catch(function (err) {
      state.transactions.splice(idx, 0, removed);
      renderAll();
      saveCache();
      showToast('Не удалось отменить операцию', true);
      console.error(err);
    });
}

/* ------------------------------------------------------------------ */
/* Старт                                                               */
/* ------------------------------------------------------------------ */

function showTelegramRequired(details) {
  document.getElementById('app').innerHTML =
    '<div style="padding-top:80px; text-align:center; color:var(--text-secondary); font-size:15px;">' +
    'Откройте это приложение через Telegram.' +
    (details ? '<div style="margin-top:14px; font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary); padding:0 24px; word-break:break-all;">' + escapeHtml(details) + '</div>' : '') +
    '</div>';
  document.querySelector('.tabbar').style.display = 'none';
}

function initApp() {
  var tg = (typeof Telegram !== 'undefined') && Telegram.WebApp;
  if (!tg || !Telegram.WebApp.initData) {
    showTelegramRequired();
    return;
  }

  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  TG_INIT_DATA = Telegram.WebApp.initData;

  // 1. Мгновенно показываем прошлое состояние, если оно есть.
  var cached = loadCache();
  if (cached && cached.transactions) {
    state.categories = cached.categories || { expense: [], income: [] };
    state.transactions = cached.transactions;
    state.serverToday = cached.serverToday;
    rebuildCategoryNames();
    renderAll();
    setStale(true);
  }

  // 2. Один запрос за актуальными данными.
  callServer('apiBootstrap', state.currentPeriod)
    .then(function (data) {
      state.categories = data.categories;
      state.serverToday = data.serverToday;
      rebuildCategoryNames();

      // Не затираем то, что ещё в полёте или упало.
      var local = state.transactions.filter(function (t) { return t.__pending || t.__failed; });
      state.transactions = local.concat(data.transactions);

      state.loaded = true;
      setStale(false);
      renderAll();
      renderCategoryChips();
      saveCache();
    })
    .catch(function (err) {
      setStale(false);
      console.error('Bootstrap failed:', err);
      if (!cached) showTelegramRequired(err.message);
      else showToast('Не удалось обновить данные', true);
    });
}

initApp();

</script>
